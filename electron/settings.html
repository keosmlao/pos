<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <title>ຕັ້ງຄ່າ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Lao', system-ui, sans-serif;
      background: #0f172a; color: #e2e8f0;
      padding: 22px; font-size: 14px;
    }
    h1 { font-size: 16px; margin-bottom: 4px; }
    label.field { display: block; font-size: 11px; color: #94a3b8; margin: 12px 0 4px; font-weight: 700; }
    input[type="text"], select {
      width: 100%; padding: 9px 12px; border-radius: 8px;
      border: 1px solid #334155; background: #1e293b; color: #f1f5f9;
      font-size: 13px; outline: none; font-family: inherit;
    }
    input:focus, select:focus { border-color: #ef4444; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
    .error { color: #f87171; font-size: 12px; min-height: 16px; margin-top: 6px; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1; padding: 10px; border-radius: 8px; border: none;
      font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .save { background: #dc2626; color: #fff; }
    .save:hover { background: #b91c1c; }
    .cancel { background: #334155; color: #cbd5e1; }
    #printerRow { display: none; }
  </style>
</head>
<body>
  <h1>⚙️ ຕັ້ງຄ່າ SMLAO POS</h1>

  <label class="field">URL ຂອງ Server</label>
  <input id="url" type="text" placeholder="http://10.0.20.180:3000" spellcheck="false" />

  <label class="check">
    <input id="silent" type="checkbox" />
    🖨️ ພິມບິນອັດຕະໂນມັດ ບໍ່ຖາມທຸກຄັ້ງ (silent print)
  </label>
  <div id="printerRow">
    <label class="field">Printer ສຳລັບພິມບິນ</label>
    <select id="printer"><option value="">— printer ຄ່າເລີ່ມຕົ້ນຂອງເຄື່ອງ —</option></select>
    <div class="hint">ເລືອກ printer ບິນ 80mm ຂອງຮ້ານ</div>
  </div>

  <div class="error" id="error"></div>
  <div class="row">
    <button class="cancel" onclick="window.close()">ຍົກເລີກ</button>
    <button class="save" id="save">ບັນທຶກ</button>
  </div>

  <script>
    const url = document.getElementById('url');
    const silent = document.getElementById('silent');
    const printer = document.getElementById('printer');
    const printerRow = document.getElementById('printerRow');
    const errorEl = document.getElementById('error');

    function refreshRows() { printerRow.style.display = silent.checked ? 'block' : 'none'; }
    silent.addEventListener('change', refreshRows);

    (async () => {
      const s = await window.posDesktop.getSettings();
      url.value = s.serverUrl;
      silent.checked = s.silentPrint;
      const printers = await window.posDesktop.getPrinters();
      for (const p of printers) {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.displayName || p.name;
        if (p.name === s.printerName) opt.selected = true;
        printer.appendChild(opt);
      }
      refreshRows();
    })();

    async function save() {
      errorEl.textContent = '';
      const res = await window.posDesktop.saveSettings({
        serverUrl: url.value,
        silentPrint: silent.checked,
        printerName: printer.value,
      });
      if (!res.ok) errorEl.textContent = res.error || 'ບັນທຶກບໍ່ສຳເລັດ';
    }
    document.getElementById('save').addEventListener('click', save);
    url.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  </script>
</body>
</html>
